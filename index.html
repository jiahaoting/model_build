<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>3D 虚拟音乐艺术展厅</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden; background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #fff;
        }
        #info {
            position: fixed; top: 20px; left: 20px; z-index: 100;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            padding: 16px 20px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1); max-width: 280px;
        }
        #info h1 {
            font-size: 18px; margin-bottom: 8px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        #info p { font-size: 13px; opacity: 0.8; line-height: 1.6; }
        #controls-hint {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            padding: 10px 20px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1); font-size: 12px; opacity: 0.8;
        }
        #video-panel {
            position: fixed; top: 76px; right: 20px; z-index: 100;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            padding: 16px 20px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1); display: none; max-width: 320px;
        }
        #video-panel h2 { font-size: 15px; margin-bottom: 6px; color: #667eea; }
        #video-panel p { font-size: 12px; opacity: 0.7; line-height: 1.5; }
        #video-panel .tip {
            margin-top: 10px; padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1); font-size: 11px; color: #ffd700;
        }
        #mode-indicator {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
            background: rgba(102,126,234,0.25); backdrop-filter: blur(10px);
            padding: 8px 18px; border-radius: 20px;
            border: 1px solid rgba(102,126,234,0.4); font-size: 13px; font-weight: 600; letter-spacing: 0.5px;
        }
        #mode-indicator .mode-name { color: #a5b4fc; }
        #mode-indicator .mode-hotkey { margin-left: 10px; font-size: 11px; opacity: 0.6; font-weight: 400; }
        #crosshair {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 6px; height: 6px; border-radius: 50%;
            background: rgba(255,255,255,0.7); box-shadow: 0 0 0 2px rgba(0,0,0,0.5);
            z-index: 99; pointer-events: none; display: none;
        }
        #loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 200;
            font-size: 16px; color: #667eea;
        }
        #btn-settings {
            position: fixed; top: 20px; right: 20px; z-index: 120;
            width: 42px; height: 42px; border-radius: 50%;
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.15);
            color: #a5b4fc; font-size: 20px; cursor: pointer;
            backdrop-filter: blur(10px); transition: transform .25s, border-color .25s;
            display: flex; align-items: center; justify-content: center;
        }
        #btn-settings:hover { transform: rotate(45deg); border-color: #667eea; }
        #settings-panel {
            position: fixed; top: 20px; right: 20px; z-index: 130;
            width: 260px; background: rgba(10,10,18,0.9); backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 14px;
            padding: 18px; display: none; flex-direction: column; gap: 16px;
        }
        .settings-header { display: flex; align-items: center; justify-content: space-between; }
        .settings-header h3 { font-size: 15px; color: #e8e8ff; }
        #btn-close-settings { background: none; border: none; color: #888; font-size: 18px; cursor: pointer; }
        #btn-close-settings:hover { color: #fff; }
        #settings-panel .row { display: flex; flex-direction: column; gap: 6px; }
        #settings-panel .row > label { font-size: 12px; opacity: 0.7; }
        .quality-group { display: flex; gap: 8px; }
        .quality-group button {
            flex: 1; padding: 7px 0; border-radius: 8px; cursor: pointer;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
            color: #ccc; font-size: 12px; transition: all .2s;
        }
        .quality-group button.active {
            background: rgba(102,126,234,0.3); border-color: #667eea; color: #fff;
        }
        #settings-panel input[type=range] { width: 100%; accent-color: #667eea; cursor: pointer; }
        .checkbox-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
        .checkbox-row input { accent-color: #667eea; cursor: pointer; }
        #fps-value { color: #7cd47c; font-variant-numeric: tabular-nums; }
        #fps-badge {
            position: fixed; bottom: 20px; right: 20px; z-index: 110;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            padding: 6px 12px; border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 12px; color: #7cd47c; font-variant-numeric: tabular-nums;
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">🎵 正在加载展厅...</div>
    <div id="info">
        <h1>🎵 虚拟音乐艺术展厅</h1>
        <p>欢迎来到我的作品集空间。沿走廊深入，经过自动门进入两个音乐展厅，点击屏幕可播放视频。</p>
    </div>
    <div id="video-panel">
        <h2 id="vp-title">作品信息</h2>
        <p id="vp-desc">作品描述...</p>
        <div class="tip">💡 把你自己的视频文件放在 videos/ 文件夹下，然后在 src/config.js 的 EXHIBITS 中替换即可。</div>
    </div>
    <div id="mode-indicator">
        🎥 模式：<span class="mode-name" id="mode-text">轨道浏览</span>
        <span class="mode-hotkey">按 C 切换模式 · 漫游模式下点击屏幕锁定鼠标</span>
    </div>
    <div id="crosshair"></div>
    <div id="fps-badge">— FPS</div>
    <div id="controls-hint">
        轨道模式：左键拖动旋转 ｜ 滚轮缩放 ｜ 右键平移 ｜ 点击屏幕播放视频 ｜ 按 <b>C</b> 切换漫游模式
    </div>

    <button id="btn-settings" title="设置">⚙</button>
    <div id="settings-panel">
        <div class="settings-header">
            <h3>⚙ 设置</h3>
            <button id="btn-close-settings">✕</button>
        </div>
        <div class="row">
            <label>画质</label>
            <div class="quality-group">
                <button id="q-low">低</button>
                <button id="q-medium">中</button>
                <button id="q-high">高</button>
            </div>
        </div>
        <div class="row">
            <label>音量</label>
            <input type="range" id="set-volume" min="0" max="100" value="80">
        </div>
        <div class="row">
            <label>鼠标灵敏度</label>
            <input type="range" id="set-sensitivity" min="50" max="300" value="200">
        </div>
        <div class="row">
            <label>性能监控</label>
            <div class="checkbox-row">
                <span><input type="checkbox" id="set-fps"> 显示 FPS</span>
                <span id="fps-value">—</span>
            </div>
        </div>
    </div>

    <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }}
    </script>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
