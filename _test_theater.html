<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>theater glb test</title>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<pre id="log">loading...</pre>
<script type="module">
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
const out = [];
function log(...a) {
  const s = a.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(' ');
  out.push(s); document.getElementById('log').textContent = out.join('\n');
  console.log(s);
}
const draco = new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);
const t0 = performance.now();
loader.load('assets/models/eastman_theater.glb',
  (g) => {
    let meshes = 0, mats = new Set();
    g.scene.traverse(o => { if (o.isMesh) { meshes++; (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>mats.add(m.uuid)); } });
    log(`OK in ${((performance.now()-t0)/1000).toFixed(1)}s meshes=${meshes} materials=${mats.size}`);
    window.__done = 'ok';
  },
  (p) => { if (p.total) log(`progress ${(p.loaded/p.total*100).toFixed(0)}%`); },
  (e) => {
    log('ERROR:', e && e.message);
    log('STACK:', e && e.stack ? e.stack.split('\n').slice(0, 12).join('\n') : '(none)');
    window.__done = 'error';
  });
</script>
</body>
</html>
